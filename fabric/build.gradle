plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

archivesBaseName = getArtifactId("fabric")

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven { url = "https://maven.kosmx.dev/" }
    maven { url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
    modCompileOnly(group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2') // for @Nonnull

    // Loaders and base APIs
    modImplementation "net.fabricmc:fabric-loader:${project.fabricLoaderVersion}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modImplementation("net.fabricmc:fabric-language-kotlin:${project.fabricKotlinVersion}")
    modApi("dev.architectury:architectury-fabric:${architecturyVersion}") {
        // Fix for the "two fabric loaders" loading crash
        exclude group: "net.fabricmc", module: "fabric-loader"
    }

    modImplementation "vazkii.patchouli:Patchouli:${minecraftVersion}-${patchouliVersion}-FABRIC"
    modImplementation "at.petra-k.hexcasting:hexcasting-fabric-${minecraftVersion}:${hexcastingVersion}"
    modRuntimeOnly "at.petra-k.paucal:paucal-fabric-${minecraftVersion}:${paucalVersion}"
    modRuntimeOnly "com.samsthenerd.inline:inline-fabric:$minecraftVersion-$inlineVersion"
    modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-api:${cardinalComponentsVersion}"
    modRuntimeOnly "io.github.tropheusj:serialization-hooks:0.4.99999"
    modImplementation("software.bernie.geckolib:geckolib-fabric-${minecraftVersion}:${geckolib_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    modImplementation ("ram.talia.moreiotas:moreiotas-fabric-$minecraftVersion:$more_iotas_version") { transitive = false }
    modImplementation "maven.modrinth:hexical:$hexical_version"
    modLocalRuntime "dev.kosmx.player-anim:player-animation-lib-fabric:1.0.2-rc1+1.20"

    modCompileOnly "maven.modrinth:dynmap:IIQSYMHC"
}

processResources {
    from(rootProject.file("common/src/main/resources")) {
        include("data/*/patchouli_books/")
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = project.archivesBaseName + "-" + project.name + "-fabric"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

publishMods {
    file = remapJar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    changelog = getLatestChangelog()
    type = STABLE
    modLoaders.add("fabric")
    modLoaders.add("quilt")

    version = project.version + "-fabric"
    displayName = "HexMapping $project.version [Fabric]"

    curseforge {
        if (System.getenv("CURSEFORGE_TOKEN") != null) {
            accessToken = System.getenv("CURSEFORGE_TOKEN")
            projectId = project.curseforgeId
            minecraftVersions.add(minecraftVersion)

            requires("fabric-api", "architectury-api", "fabric-language-kotlin", "hexcasting", "moreiotas")
            optional("bluemap", "dynmapforge")
        }
    }

    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN")
        projectId = project.modrinthId
        minecraftVersions.add(minecraftVersion)

        requires("architectury-api")
        requires("kotlin-for-forge")
        requires("hex-casting")
        requires("moreiotas")

        optional("hexical")

        optional("bluemap")
        optional("dynmap")
        optional("pl3xmap")
        optional("squaremap")
    }
}
